name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  java-provisioning-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "maven"
      - name: Run Maven tests
        working-directory: services/provisioning-service
        run: mvn -B test

  python-config-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: services/config-worker
        run: pip install -r requirements.txt
      - name: Run PyTest
        working-directory: services/config-worker
        run: pytest --cov=app --cov-fail-under=85
